<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h3>Register</h3>
            </div>
            <div class="card-body">
                <div ng-if="error" class="alert alert-danger">
                    {{ error }}
                </div>
                
                <form ng-submit="register()">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" ng-model="userData.email" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control" ng-model="userData.username" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" ng-model="userData.password" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" ng-model="userData.confirmPassword" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">Register</button>
                    <a href="#!/login" class="btn btn-link">Login</a>
                </form>
            </div>
        </div>
    </div>
</div>
