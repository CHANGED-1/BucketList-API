<!DOCTYPE html>
<html ng-app="bucketListApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BucketList Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#!/">BucketList</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item" ng-hide="isLoggedIn()">
                        <a class="nav-link" href="#!/login">Login</a>
                    </li>
                    <li class="nav-item" ng-hide="isLoggedIn()">
                        <a class="nav-link" href="#!/register">Register</a>
                    </li>
                    <li class="nav-item" ng-show="isLoggedIn()">
                        <a class="nav-link" href="#!/bucketlists">My Lists</a>
                    </li>
                    <li class="nav-item" ng-show="isLoggedIn()">
                        <a class="nav-link" href="#" ng-click="logout()">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-4">
        <div ng-view></div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/angular@1.8.3/angular.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/angular-route@1.8.3/angular-route.min.js"></script>
    <script src="app/app.module.js"></script>
    <script src="app/app.routes.js"></script>
    <script src="app/services/auth.service.js"></script>
    <script src="app/services/bucketlist.service.js"></script>
    <script src="app/components/auth/login.controller.js"></script>
    <script src="app/components/auth/register.controller.js"></script>
    <script src="app/components/bucketlists/bucketlist.controller.js"></script>
</body>
</html>
